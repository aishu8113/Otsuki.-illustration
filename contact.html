<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1531"><meta name="description" content="Otuki. へのイラスト・Live2D制作のご相談・お問い合わせ。"><title>Contact | Otuki.</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="data.js" defer></script><script src="cms-bridge.js" defer></script><script src="app.js" defer></script></head><body class="contact-page"><div class="world-bg" aria-hidden="true"></div><div class="fireflies" id="fireflies" aria-hidden="true"></div><header class="header"><a class="logo" href="index.html">O<span>tuki.</span><i>✧</i></a><a class="back-home" href="index.html">← HOME</a></header><main class="contact-layout"><div class="contact-art-side"><img id="contact-image" src="assets/placeholder-contact.svg" alt="お問い合わせページ用イラスト（仮素材）"><div class="contact-art-shade"></div><div class="contact-art-words"><span>✦　A LITTLE LIGHT IN THE FOREST</span><p>あなたの物語を、<br>一緒に描けたら。</p></div><span class="image-label">IMAGE PLACEHOLDER / 差し替え可能</span></div><section class="contact-form-side"><div class="contact-heading"><p class="eyebrow">LET'S CREATE A STORY</p><h1>Contact</h1><p class="jp-sub">お問い合わせ</p><div class="heading-ornament">─── ✦ ───</div><p class="form-intro">イラスト・Live2D制作などのご相談はこちらから。<br>個人・法人を問わず、お気軽にお問い合わせください。</p></div><form id="contact-form" class="contact-form"><label>お名前・ご活動名 <b>必須</b><input type="text" name="name" required autocomplete="name" placeholder="例）山田 花子 / 活動名"></label><label>メールアドレス <b>必須</b><input type="email" name="email" required autocomplete="email" placeholder="example@example.com"></label><label>ご依頼の種類 <b>必須</b><select name="category" required><option value="">選択してください</option><option>イラスト制作</option><option>Live2D制作</option><option>キャラクターデザイン</option><option>企業案件・商用利用</option><option>その他</option></select></label><label>ご依頼内容 <b>必須</b><textarea name="message" rows="5" required placeholder="用途、制作イメージ、参考資料など、決まっている範囲でご記入ください。"></textarea></label><div class="form-columns"><label>ご予算（目安）<select name="budget"><option value="">未定・相談したい</option><option>〜3万円</option><option>3万〜5万円</option><option>5万〜10万円</option><option>10万円以上</option></select></label><label>ご希望納期<input type="date" name="deadline"></label></div><button class="gold-btn submit-btn" type="submit">送信内容をメールで開く <span>↗</span></button><p class="form-status" id="form-status" role="status" aria-live="polite"></p><p class="form-disclaimer">※ 試作版です。送信先メールアドレスを設定すると、メールアプリで送信内容を作成できます。フォームからの直接送信は未実装です。</p></form></section></main><footer class="contact-footer">© <span id="year"></span> Otuki. — Illustration & Live2D</footer></body></html>
