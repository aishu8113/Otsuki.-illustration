name: Update CMS Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch microCMS data
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          mkdir -p data

          curl --fail --silent --show-error \
            -H "X-MICROCMS-API-KEY: $MICROCMS_API_KEY" \
            "https://otuki.microcms.io/api/v1/site-settings" \
            -o data/site-settings.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/site-settings.json

          if ! git diff --cached --quiet; then
            git commit -m "Update CMS data"
            git push
          fi
